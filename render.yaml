services:
  - type: web
    name: anime-horizon
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/chat/completions
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: AI_TIMEOUT_MS
        value: '45000'
      - key: CORS_ORIGINS
        sync: false
